<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我的与点赞</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar(${navKey})}"></div>
<div class="page-wrap">
    <div th:if="${msg != null}" style="background:#f8d7da;color:#721c24;padding:12px;border-radius:4px;margin-bottom:16px">[[${msg}]]</div>
    <h2 style="font-size:20px">我的收藏 / 点赞 / 已发布</h2>
    <p>
        <a class="btn btn-sm" th:classappend="${tab == 'collect'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/collects}">景点信息收藏</a>
        <a class="btn btn-sm" th:classappend="${tab == 'like'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/likes}" style="margin-left:8px">景点信息点赞</a>
        <a class="btn btn-sm" th:classappend="${tab == 'post_collect'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/post-collects}" style="margin-left:8px">推荐帖收藏</a>
        <a class="btn btn-sm" th:classappend="${tab == 'post_like'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/post-likes}" style="margin-left:8px">推荐帖点赞</a>
        <a class="btn btn-sm" th:classappend="${tab == 'published'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/published}" style="margin-left:8px">已发布景点</a>
        <a class="btn btn-sm" th:classappend="${tab == 'posts'} ? 'btn-primary' : 'btn-outline'" th:href="@{/post/my}" style="margin-left:8px">我的推荐帖</a>
    </p>
    
    <div th:if="${tab == 'published'}" class="search-bar" style="background:#fff;padding:20px;border-radius:8px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div style="flex:1;min-width:200px">
            <label>关键词</label>
            <input class="layui-input" id="keyword" placeholder="景点名称、地址等"/>
        </div>
        <div style="width:160px">
            <label>城市</label>
            <select class="layui-select" id="city" style="height:38px;width:100%">
                <option value="all">全部</option>
                <option value="南京">南京</option>
                <option value="苏州">苏州</option>
                <option value="杭州">杭州</option>
                <option value="黄山">黄山</option>
            </select>
        </div>
        <div style="width:160px">
            <label>等级</label>
            <select class="layui-select" id="level" style="height:38px;width:100%">
                <option value="all">全部</option>
                <option value="AAAAA">AAAAA</option>
                <option value="AAAA">AAAA</option>
                <option value="AAA">AAA</option>
            </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="filterLandscapes()">搜索</button>
        <button type="button" class="btn btn-outline" onclick="resetFilter()">重置</button>
    </div>
    
    <div th:if="${tab == 'published'}" class="sort-bar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:14px;color:#6c757d">
        <span>共 <strong id="total" th:text="${#lists.size(landscapes)}">0</strong> 条</span>
    </div>
    
    <div class="grid" style="display:flex;flex-wrap:wrap;gap:24px;margin-top:16px">
        <div class="landscape-card" style="width:calc((100% - 72px) / 4);background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05)" th:each="l : ${landscapes}">
            <div class="card-img" style="height:170px">
                <img th:if="${l.imagePath != null}" th:src="${l.imagePath}" th:alt="${l.title}" style="width:100%;height:100%;object-fit:cover"/>
                <img th:unless="${l.imagePath != null}" th:src="@{'https://picsum.photos/seed/' + ${l.landscapeId} + '/400/240'}" th:alt="${l.title}" style="width:100%;height:100%;object-fit:cover"/>
            </div>
            <div class="card-content" style="padding:14px">
                <div style="display:flex;justify-content:space-between;align-items-start;margin-bottom:8px">
                    <div class="card-title" style="font-size:15px;font-weight:600">
                        <a th:href="@{/landscapes/{id}(id=${l.landscapeId})}" th:text="${l.title}" style="color:#333;text-decoration:none">标题</a>
                    </div>
                    <div th:if="${tab == 'published'}">
                        <span th:if="${l.auditState == '审核通过'}" style="font-size:12px;color:#28a745;background:#d4edda;padding:2px 6px;border-radius:4px">已通过</span>
                        <span th:if="${l.auditState == '审核未通过'}" style="font-size:12px;color:#dc3545;background:#f8d7da;padding:2px 6px;border-radius:4px">未通过</span>
                        <span th:if="${l.auditState == '审核中' || l.auditState == '待审核'}" style="font-size:12px;color:#ffc107;background:#fff3cd;padding:2px 6px;border-radius:4px">审核中</span>
                    </div>
                </div>
                <div class="muted" style="font-size:12px;color:#6c757d" th:text="${l.address}">地址</div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                    <span class="muted" style="font-size:12px;color:#6c757d" th:text="${l.level}">等级</span>
                    <div th:if="${tab == 'published'}" style="display:flex;align-items:center;gap:6px">
                        <a th:href="@{/landscapes/edit/{id}(id=${l.landscapeId})}" class="btn btn-sm" style="background:#fff;color:#1a56db;border:1px solid #1a56db;padding:4px 10px;font-size:12px;text-decoration:none">编辑</a>
                        <form th:action="@{/landscapes/delete/{id}(id=${l.landscapeId})}" method="post" style="display:inline" onsubmit="return confirm('确定要删除这个景点吗？')">
                            <button type="submit" class="btn btn-sm" style="background:#dc3545;color:#fff;border:none;padding:4px 10px;font-size:12px;cursor:pointer;border-radius:4px">删除</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(landscapes)}" class="muted" style="padding:40px;text-align:center">暂无记录</p>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script th:if="${tab == 'published'}">
    let allLandscapes = [];
    
    // 页面加载时保存所有景点数据
    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.landscape-card');
        cards.forEach(card => {
            const link = card.querySelector('.card-title a');
            const cardContent = card.querySelector('.card-content');
            const mutedElements = cardContent.querySelectorAll('.muted');
            
            // 从链接的 href 属性获取景点ID
            const href = link.getAttribute('href');
            const match = href.match(/\/landscapes\/(\w+)/);
            if (match) {
                allLandscapes.push({
                    id: match[1],
                    title: link.textContent.trim(),
                    address: mutedElements.length > 0 ? mutedElements[0].textContent.trim() : '',
                    level: mutedElements.length > 1 ? mutedElements[1].textContent.trim() : '',
                    element: card
                });
            }
        });
    });
    
    function filterLandscapes() {
        const keyword = document.getElementById('keyword').value.toLowerCase();
        const city = document.getElementById('city').value;
        const level = document.getElementById('level').value;
        
        let filtered = allLandscapes.filter(l => {
            const matchKeyword = !keyword || l.title.toLowerCase().includes(keyword) || l.address.toLowerCase().includes(keyword);
            const matchCity = city === 'all' || l.address.includes(city);
            const matchLevel = level === 'all' || l.level === level;
            return matchKeyword && matchCity && matchLevel;
        });
        
        updateDisplay(filtered);
    }
    
    function resetFilter() {
        document.getElementById('keyword').value = '';
        document.getElementById('city').value = 'all';
        document.getElementById('level').value = 'all';
        updateDisplay(allLandscapes);
    }
    
    function sortBy(type) {
        const activeLinks = document.querySelectorAll('.sort-bar a');
        activeLinks.forEach(link => link.classList.remove('active'));
        
        let sorted = [...allLandscapes];
        if (type === 'hot') {
            document.getElementById('sort-hot').classList.add('active');
            // 随机模拟点赞数排序
            sorted.sort((a, b) => Math.random() - 0.5);
        } else if (type === 'time') {
            document.getElementById('sort-time').classList.add('active');
            // 按 ID 排序模拟发布时间
            sorted.sort((a, b) => b.id.localeCompare(a.id));
        } else if (type === 'level') {
            document.getElementById('sort-level').classList.add('active');
            const levelOrder = {'AAAAA': 5, 'AAAA': 4, 'AAA': 3};
            sorted.sort((a, b) => (levelOrder[b.level] || 0) - (levelOrder[a.level] || 0));
        }
        
        updateDisplay(sorted);
    }
    
    function updateDisplay(landscapes) {
        const grid = document.querySelector('.grid');
        const total = document.getElementById('total');
        
        total.textContent = landscapes.length;
        
        // 隐藏所有卡片
        document.querySelectorAll('.landscape-card').forEach(card => card.style.display = 'none');
        
        // 显示匹配的卡片
        landscapes.forEach(l => {
            l.element.style.display = 'block';
        });
        
        // 显示/隐藏空状态提示
        const emptyMsg = document.querySelector('p.muted');
        if (landscapes.length === 0) {
            emptyMsg.style.display = 'block';
        } else {
            emptyMsg.style.display = 'none';
        }
    }
</script>
</body>
</html>

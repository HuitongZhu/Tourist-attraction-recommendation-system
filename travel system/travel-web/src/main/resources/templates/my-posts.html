<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我的收藏与点赞</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar(${navKey})}"></div>
<div class="page-wrap">
    <h2 style="font-size:20px">我的收藏 / 点赞 / 已发布</h2>
    <p>
        <a class="btn btn-sm" th:classappend="${tab == 'collect'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/collects}">景点信息收藏</a>
        <a class="btn btn-sm" th:classappend="${tab == 'like'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/likes}" style="margin-left:8px">景点信息点赞</a>
        <a class="btn btn-sm" th:classappend="${tab == 'post_collect'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/post-collects}" style="margin-left:8px">推荐帖收藏</a>
        <a class="btn btn-sm" th:classappend="${tab == 'post_like'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/post-likes}" style="margin-left:8px">推荐帖点赞</a>
        <a class="btn btn-sm" th:classappend="${tab == 'published'} ? 'btn-primary' : 'btn-outline'" th:href="@{/my/published}" style="margin-left:8px">已发布景点</a>
        <a class="btn btn-sm" th:classappend="${tab == 'posts'} ? 'btn-primary' : 'btn-outline'" th:href="@{/post/my}" style="margin-left:8px">我的推荐帖</a>
    </p>
    
    <div th:if="${#lists.isEmpty(posts)}" class="muted" style="padding:40px;text-align:center">暂无推荐帖</div>
    
    <div class="grid" style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
        <div class="post-card" style="background:#fff;border-radius:8px;padding:20px;border:1px solid #f0f0f0;transition:box-shadow 0.2s" th:each="p : ${posts}">
            <div style="display:flex;justify-content:space-between;align-items-start;margin-bottom:12px">
                <div>
                    <div style="display:flex;align-items:center;gap:10px">
                        <h3 style="font-size:16px;font-weight:600;margin:0">
                            <a th:href="@{/posts/{id}(id=${p.recomId})}" th:text="${p.title != null ? p.title : '未命名帖子'}" style="color:#333;text-decoration:none">标题</a>
                        </h3>
                        <span th:if="${landscapeTitles[p.recomId] != null}" style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:4px;font-size:12px">
                            [[${landscapeTitles[p.recomId]}]]
                        </span>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;" th:if="${p.tag != null and p.tag != ''}">
                        <th:block th:each="tagItem : ${p.tag.split(',')}">
                            <span class="tag" style="background:#f5f5f5;color:#666;padding:2px 8px;border-radius:4px;font-size:12px" th:text="'#' + ${tagItem.trim()}"></span>
                        </th:block>
                    </div>
                    <th:block th:if="${tab == 'posts'}">
                        <span th:if="${p.auditState == '审核通过'}" style="font-size:12px;color:#28a745;background:#d4edda;padding:2px 8px;border-radius:4px">已通过</span>
                        <span th:if="${p.auditState == '审核未通过'}" style="font-size:12px;color:#dc3545;background:#f8d7da;padding:2px 8px;border-radius:4px">未通过</span>
                        <span th:if="${p.auditState == '审核中' || p.auditState == '待审核'}" style="font-size:12px;color:#ffc107;background:#fff3cd;padding:2px 8px;border-radius:4px">审核中</span>
                    </th:block>
                </div>
                <div th:if="${tab == 'posts'}" style="display:flex;align-items:center;gap:8px">
                    <a th:href="@{/posts/edit/{id}(id=${p.recomId})}" class="btn btn-outline" style="text-decoration:none">编辑</a>
                    <form th:action="@{/posts/delete/{id}(id=${p.recomId})}" method="post" style="display:inline" onsubmit="return confirm('确定要删除这篇推荐帖吗？')">
                        <button type="submit" class="btn btn-primary" style="background:#dc3545;border-color:#dc3545">删除</button>
                    </form>
                </div>
            </div>
            <p style="font-size:14px;color:#666;line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" th:text="${p.content}">内容摘要</p>
            <p style="font-size:12px;color:#999" th:text="${#temporals.format(p.publishTime, 'yyyy-MM-dd HH:mm')}">发布时间</p>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${post.title}">推荐帖详情</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar(${navKey})}"></div>
<div class="page-wrap">
    <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="card">
        <h1 style="margin:0 0 12px;font-size:22px" th:text="${post.title}">标题</h1>
        <div th:if="${landscapeTitle != null}" style="margin-bottom:12px;">
            <span style="background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:4px;font-size:13px">
                关联景点：[[${landscapeTitle}]]
            </span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;" th:if="${post.tag != null and post.tag != ''}">
            <th:block th:each="tagItem : ${post.tag.split(',')}">
                <span class="tag" style="background:#e8f0fe;color:#1a56db;padding:4px 10px;border-radius:4px;font-size:12px" th:text="'#' + ${tagItem.trim()}"></span>
            </th:block>
        </div>
        <div class="actions" style="display:flex;gap:10px;margin-bottom:12px;">
            <form th:if="${loginUserId != null}" th:action="@{/interactions/post/{id}/collect(id=${post.recomId})}" method="post">
                <button type="submit" class="btn btn-sm" th:classappend="${collected} ? 'btn-primary' : 'btn-outline'"
                        th:text="${collected} ? '已收藏' : '收藏'">收藏</button>
            </form>
            <form th:if="${loginUserId != null}" th:action="@{/interactions/post/{id}/like(id=${post.recomId})}" method="post">
                <button type="submit" class="btn btn-sm" th:classappend="${liked} ? 'btn-primary' : 'btn-outline'"
                        th:text="${liked} ? '已点赞（' + ${likeCount} + '）' : '点赞（' + ${likeCount} + '）'">点赞</button>
            </form>
            <span th:if="${loginUserId == null}" class="muted">登录后可点赞、收藏</span>
        </div>
        <p class="muted" th:text="${#temporals.format(post.publishTime, 'yyyy-MM-dd HH:mm')}">时间</p>
        <div style="white-space:pre-wrap;line-height:1.8;margin-top:16px" th:text="${post.content}">正文</div>
    </div>
    <div class="card">
        <h3 style="margin-top:0">评论（<span th:text="${#lists.size(comments)}">0</span>）</h3>
        <form th:if="${loginUserId != null}" th:action="@{/comments/post}" method="post">
            <input type="hidden" name="recomId" th:value="${post.recomId}"/>
            <textarea class="layui-textarea" name="content" rows="4" required placeholder="发表看法"></textarea>
            <button type="submit" class="btn btn-primary" style="margin-top:10px">提交评论</button>
        </form>
        <p th:if="${loginUserId == null}" class="muted"><a th:href="@{/login(next=${'/posts/' + post.recomId})}">登录</a> 后评论</p>
        <div class="comment" th:each="c : ${comments}" style="border-bottom:1px solid #f0f0f0;padding:12px 0">
            <div style="display:flex;justify-content:space-between;font-size:13px">
                <strong th:text="${c.userName}">用户</strong>
                <span class="muted" th:text="${#temporals.format(c.publishTime, 'yyyy-MM-dd HH:mm')}">时间</span>
            </div>
            <p style="margin:8px 0 0;white-space:pre-wrap" id="comment-content-[[${c.commentId}]]">[[${c.content}]]</p>
            <div id="comment-actions-[[${c.commentId}]]" style="margin-top:8px;">
                <span th:if="${loginUserId != null and loginUserId == c.userId}">
                    <button type="button" class="btn btn-sm btn-outline" style="color:#1a56db;border-color:#1a56db" onclick="showEditForm('[[${c.commentId}]]')">编辑</button>
                    <form th:action="@{/comments/post/{cid}/delete(cid=${c.commentId})}" method="post" style="display:inline" onsubmit="return confirm('确定要删除这条评论吗？')">
                        <button type="submit" class="btn btn-sm btn-outline" style="color:#c0392b;border-color:#f5c6cb">删除</button>
                    </form>
                </span>
            </div>
            <div id="edit-form-[[${c.commentId}]]" style="display:none;margin-top:10px;">
                <form th:action="@{/comments/post/{cid}/update(cid=${c.commentId})}" method="post">
                    <textarea class="layui-textarea" name="content" rows="3" required>[[${c.content}]]</textarea>
                    <div style="display:flex;gap:8px;margin-top:8px">
                        <button type="submit" class="btn btn-sm btn-primary">保存</button>
                        <button type="button" class="btn btn-sm btn-outline" onclick="hideEditForm('[[${c.commentId}]]')">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script>
function showEditForm(commentId) {
    document.getElementById('comment-content-' + commentId).style.display = 'none';
    document.getElementById('comment-actions-' + commentId).style.display = 'none';
    document.getElementById('edit-form-' + commentId).style.display = 'block';
}

function hideEditForm(commentId) {
    document.getElementById('edit-form-' + commentId).style.display = 'none';
    document.getElementById('comment-content-' + commentId).style.display = 'block';
    document.getElementById('comment-actions-' + commentId).style.display = 'block';
}
</script>
</body>
</html>

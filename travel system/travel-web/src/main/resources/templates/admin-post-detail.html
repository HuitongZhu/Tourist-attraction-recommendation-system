<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${post.tag}">推荐帖详情</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.9.10/css/layui.css"/>
    <style>
        .top-nav-admin {
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
        }
        .nav-container-admin {
            width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .nav-logo-admin {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-logo-admin .logo-text {
            font-size: 18px;
            font-weight: bold;
            color: #1a56db;
        }
        .nav-user-admin {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-link-admin {
            text-decoration: none;
            color: #1a56db;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-btn-admin {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            background-color: #fff;
            color: #1a56db;
            border: 1px solid #1a56db;
            text-decoration: none;
        }
        .nav-btn-admin:hover {
            background-color: #1a56db;
            color: #fff;
        }
        .back-btn {
            background-color: #1a56db;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 16px;
            display: inline-block;
            border: none;
        }
        .back-btn:hover {
            opacity: 0.9;
        }
        .page-wrap {
            padding-top: 80px;
        }
        .comment-delete-btn {
            background-color: #ff4d4f;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .comment-delete-btn:hover {
            background-color: #ff7875;
        }
    </style>
</head>
<body>
<header class="top-nav-admin">
    <div class="nav-container-admin">
        <div class="nav-logo-admin">
            <span class="logo-text">旅游景点推荐系统</span>
        </div>
        <div class="nav-user-admin">
            <a href="/admin" class="nav-link-admin">管理员中心</a>
            <a href="/logout" class="nav-btn-admin">退出登录</a>
        </div>
    </div>
</header>
<div class="page-wrap">
    <button onclick="history.back()" class="back-btn">← 返回管理员中心</button>
    <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="card">
        <h1 style="margin:0 0 12px;font-size:22px" th:text="${post.tag}">标题</h1>
        <p class="muted" th:text="'发布用户：' + ${post.userId} + ' | ' + ${#temporals.format(post.publishTime, 'yyyy-MM-dd HH:mm')}">时间</p>
        <div style="white-space:pre-wrap;line-height:1.8;margin-top:16px" th:text="${post.content}">正文</div>
    </div>
    <div class="card">
        <h3 style="margin-top:0">评论（<span th:text="${#lists.size(comments)}">0</span>）</h3>
        <div class="comment" th:each="c : ${comments}" style="border-bottom:1px solid #f0f0f0;padding:12px 0">
            <div style="display:flex;justify-content:space-between;font-size:13px">
                <strong th:text="${c.userName}">用户</strong>
                <div style="display:flex;align-items:center;gap:10px">
                    <span class="muted" th:text="${#temporals.format(c.publishTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                    <button class="comment-delete-btn" th:attr="onclick=|deletePostComment('${c.commentId}')|">删除</button>
                </div>
            </div>
            <p style="margin:8px 0 0;white-space:pre-wrap" th:text="${c.content}">内容</p>
        </div>
    </div>
</div>
<script src="https://cdn.staticfile.org/layui/2.9.10/layui.js"></script>
<script>
    function deletePostComment(commentId) {
        layer.confirm('确定删除该评论？', {
            btn: ['确定', '取消']
        }, function(index) {
            layer.close(index);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/admin/postcomments/delete');
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onload = function() {
                if (xhr.responseText === 'success') {
                    layer.msg('删除成功', {icon: 1});
                    setTimeout(function() {
                        location.reload();
                    }, 1500);
                } else {
                    layer.msg('删除失败', {icon: 2});
                }
            };
            xhr.send('id=' + commentId);
        });
    }
</script>
</body>
</html>

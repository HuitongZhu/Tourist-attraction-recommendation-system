spring:
  application:
    name: travel-web
  datasource:
    url: jdbc:mysql://localhost:3306/travel?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&allowPublicKeyRetrieval=true
    username: root
    password: 密码
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl  # ← 移到这里
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: TRAVELSESSION

logging:
  level:
    org.hibernate.SQL: warn
    com.travel.travelweb: info

# 阿里云号码认证服务（短信验证码）— 不是「短信服务 Dysmsapi」里的签名/模板！
# 请到号码认证控制台 → 短信认证 → 赠送模板配置，复制「赠送签名名称」和「赠送模板 CODE」
# 文档：https://help.aliyun.com/zh/pnvs/use-cases/sms-verify-for-individual-developers
# 注意：SMS_ 开头的模板属于短信服务，不能用于号码认证 API
aliyun:
  sms:
    enabled: true
    access-key-id: 自己的
    access-key-secret: 自己的
    # ↓ 必须改为控制台「赠送模板配置」里的值，例如 sign-name: 速通互联验证码  template-code: 100001
    sign-name: 速通互联验证码
    template-code: 100001
    scheme-name:
    country-code: "86"
    code-length: 6
    valid-time: 300
    interval: 60
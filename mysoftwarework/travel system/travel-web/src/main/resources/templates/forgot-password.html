<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>找回密码 - 旅游景点推荐系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { background: #f8f9fa; }
        .split { display: flex; min-height: 100vh; }
        .side { width: 280px; background: #f0f7ff; padding: 40px 24px; box-sizing: border-box; }
        .main { flex: 1; display: flex; align-items: center; justify-content: center; }
        .box { width: 420px; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
        h1 { font-size: 20px; margin: 0 0 20px; color: #333; }
        .step { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .step-number { width: 24px; height: 24px; border-radius: 50%; background: #0d6efd; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .step-text { font-size: 14px; color: #333; }
        
        .input-group { display: flex; align-items: center; }
        .input-group input { flex: 1; border-radius: 4px 0 0 4px; border-right: none; }
        .code-btn {
            background: #f0f7ff;
            color: #0d6efd;
            border: 1px solid #b6d4fe;
            padding: 10px 12px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 12px;
            width: 90px;
            text-align: center;
            white-space: nowrap;
        }
        .code-btn:hover { background: #e0ebff; }
        .code-btn.disabled {
            background: #f8f9fa;
            color: #adb5bd;
            border-color: #dee2e6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="split">
    <div class="side">
        <div class="logo-text" style="margin-bottom:12px">旅游景点推荐系统</div>
        <p style="font-size:13px;color:#6c757d;line-height:1.6">旅游景点推荐系统，让你的旅行更加轻松愉快，发现更多美好的景点。</p>
    </div>
    <div class="main">
        <div class="box">
            <h1>找回密码</h1>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
            
            <!-- 步骤1：输入手机号 -->
            <div id="step1" th:if="${step == null || step == 1}">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-text">输入手机号</div>
                </div>
                <form th:action="@{/forgot-password/verify-phone}" method="post">
                    <div class="form-row">
                        <label>手机号</label>
                        <input class="layui-input" name="phone" required placeholder="请输入手机号"/>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:16px">下一步</button>
                    <p style="text-align:center;margin-top:12px"><a href="/login" style="color:#0d6efd;font-size:12px">返回登录</a></p>
                </form>
            </div>
            
            <!-- 步骤2：验证身份（发送验证码） -->
            <div id="step2" th:if="${step == 2}">
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-text">验证身份</div>
                </div>
                <p style="font-size:13px;color:#6c757d;margin-bottom:16px">验证码已发送至手机：<span style="color:#333">***</span><span th:text="${phoneSuffix}"></span></p>
                <form th:action="@{/forgot-password/verify-code}" method="post">
                    <input type="hidden" name="phone" th:value="${phone}"/>
                    <div class="form-row">
                        <label>验证码</label>
                        <div class="input-group">
                            <input class="layui-input" name="code" required placeholder="请输入验证码"/>
                            <button type="button" class="code-btn" id="sendCodeBtn">发送验证码</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:16px">下一步</button>
                    <p style="text-align:center;margin-top:12px"><a href="/forgot-password" style="color:#0d6efd;font-size:12px">返回上一步</a></p>
                </form>
            </div>
            
            <!-- 步骤3：设置新密码 -->
            <div id="step3" th:if="${step == 3}">
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-text">设置新密码</div>
                </div>
                <form th:action="@{/forgot-password/reset}" method="post">
                    <input type="hidden" name="phone" th:value="${phone}"/>
                    <div class="form-row">
                        <label>新密码（6-30位）</label>
                        <input class="layui-input" type="password" name="newPassword" required minlength="6" maxlength="30" placeholder="请输入新密码"/>
                    </div>
                    <div class="form-row">
                        <label>确认密码</label>
                        <input class="layui-input" type="password" name="confirmPassword" required placeholder="请再次输入新密码"/>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:16px">确认修改</button>
                </form>
            </div>
            
            <!-- 成功页面 -->
            <div id="step4" th:if="${step == 4}">
                <div style="text-align:center;padding:20px">
                    <div style="font-size:48px;margin-bottom:16px">✓</div>
                    <h2 style="color:#198754">密码找回成功</h2>
                    <p style="color:#6c757d;margin-top:8px">您的密码已更新，请使用新密码登录</p>
                    <a href="/login" class="btn btn-primary" style="margin-top:20px">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var sendCodeBtn = document.getElementById('sendCodeBtn');
        if (sendCodeBtn) {
            sendCodeBtn.addEventListener('click', function() {
                var btn = this;
                btn.classList.add('disabled');
                btn.textContent = '发送中...';
                
                fetch('/forgot-password/send-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'phone=' + encodeURIComponent(document.querySelector('input[name="phone"]').value)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('验证码: ' + data.code);
                        var count = 60;
                        btn.textContent = count + '秒后重发';
                        var timer = setInterval(function() {
                            count--;
                            if (count <= 0) {
                                clearInterval(timer);
                                btn.textContent = '发送验证码';
                                btn.classList.remove('disabled');
                            } else {
                                btn.textContent = count + '秒后重发';
                            }
                        }, 1000);
                    } else {
                        alert(data.message);
                        btn.textContent = '发送验证码';
                        btn.classList.remove('disabled');
                    }
                })
                .catch(error => {
                    alert('发送失败，请稍后重试');
                    btn.textContent = '发送验证码';
                    btn.classList.remove('disabled');
                });
            });
        }
    });
</script>
</body>
</html>

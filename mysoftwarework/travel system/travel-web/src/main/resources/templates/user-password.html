<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>修改密码</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "微软雅黑", sans-serif;
            background-color: #fafbfc;
        }
        .top-nav {
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
        }
        .nav-container {
            width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-text {
            font-size: 18px;
            font-weight: bold;
            color: #1a56db;
        }
        .nav-menu {
            display: flex;
            gap: 30px;
        }
        .nav-menu a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }
        .nav-menu a:hover, .nav-menu a.active {
            color: #1a56db;
            border-bottom: 2px solid #1a56db;
        }
        .nav-user {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f0f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a56db;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: none;
        }
        .publish-btn {
            background-color: #1a56db;
            color: #fff;
        }
        .page-wrap {
            padding-top: 80px;
            padding-bottom: 40px;
        }
        .card {
            max-width: 480px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 24px;
        }
        .form-row {
            margin-bottom: 16px;
        }
        .form-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #666;
        }
        .form-row input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-row input:focus {
            outline: none;
            border-color: #1a56db;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background-color: #1a56db;
            color: white;
        }
        .btn-outline {
            background-color: white;
            border: 1px solid #ddd;
            color: #333;
        }
        .alert {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 4px;
            font-size: 13px;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .verify-btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .verify-btn-group button {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .verify-btn-group button.active {
            border-color: #1a56db;
            background: #1a56db;
            color: white;
        }
        .sms-code-row {
            display: flex;
            gap: 10px;
        }
        .sms-code-row input {
            flex: 1;
        }
        .sms-code-row button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .sms-code-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-text">旅游景点推荐系统</span>
            </div>
            <div class="nav-menu">
                <a href="/">首页</a>
                <a href="/landscapes">景点信息</a>
                <a href="/posts">推荐帖</a>
                <a href="/my/collects">我的</a>
                <a href="/user/profile" class="active">个人中心</a>
            </div>
            <div class="nav-user">
                <button class="nav-btn publish-btn" onclick="window.location.href='/landscapes/new'">发布景点</button>
                <button class="nav-btn publish-btn" onclick="window.location.href='/posts/new'">发布推荐帖</button>
                <div class="user-avatar" th:text="${session.userName != null ? session.userName.charAt(0) : '用'}"></div>
            </div>
        </div>
    </div>

    <div class="page-wrap">
        <div class="card">
            <h2 style="margin:0 0 20px;font-size:18px;font-weight:bold;color:#333">修改密码</h2>
            
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
            
            <form th:action="@{/user/password}" method="post" id="passwordForm">
                <input type="hidden" name="verifyType" id="verifyType" th:value="${verifyType != null ? verifyType : 'password'}"/>
                
                <div class="verify-btn-group">
                    <button type="button" id="passwordVerifyBtn" onclick="switchVerify('password')" class="active">密码验证</button>
                    <button type="button" id="smsVerifyBtn" onclick="switchVerify('sms')">短信验证</button>
                </div>
                
                <div id="passwordSection">
                    <div class="form-row">
                        <label>原密码</label>
                        <input type="password" name="verifyValue" id="oldPasswordInput" placeholder="请输入原密码"/>
                    </div>
                </div>
                
                <div id="smsSection" style="display:none">
                    <div class="form-row">
                        <label>手机号</label>
                        <input type="text" name="phone" id="phoneInput" placeholder="请输入手机号" readonly/>
                    </div>
                    <div class="form-row">
                        <label>验证码</label>
                        <div class="sms-code-row">
                            <input type="text" name="verifyValue" id="smsCodeInput" placeholder="请输入验证码"/>
                            <button type="button" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <label>新密码（6-30位）</label>
                    <input type="password" name="newPassword" id="newPasswordInput" required minlength="6" maxlength="30" placeholder="请输入新密码"/>
                </div>
                <div class="form-row">
                    <label>确认新密码</label>
                    <input type="password" name="confirmPassword" id="confirmPasswordInput" required placeholder="请确认新密码"/>
                </div>
                
                <div style="display:flex;gap:12px;margin-top:20px">
                    <button type="submit" class="btn btn-primary">确认修改</button>
                    <a class="btn btn-outline" th:href="@{/user/profile}" style="text-decoration:none;display:inline-block;text-align:center;padding:10px 20px">返回</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function switchVerify(type) {
            document.getElementById('verifyType').value = type;
            
            const passwordSection = document.getElementById('passwordSection');
            const smsSection = document.getElementById('smsSection');
            const passwordBtn = document.getElementById('passwordVerifyBtn');
            const smsBtn = document.getElementById('smsVerifyBtn');
            const oldPasswordInput = document.getElementById('oldPasswordInput');
            const smsCodeInput = document.getElementById('smsCodeInput');
            
            if (type === 'password') {
                passwordSection.style.display = 'block';
                smsSection.style.display = 'none';
                passwordBtn.classList.add('active');
                smsBtn.classList.remove('active');
                oldPasswordInput.value = '';
                oldPasswordInput.disabled = false;
                smsCodeInput.disabled = true;
            } else {
                passwordSection.style.display = 'none';
                smsSection.style.display = 'block';
                passwordBtn.classList.remove('active');
                smsBtn.classList.add('active');
                smsCodeInput.value = '';
                smsCodeInput.disabled = false;
                oldPasswordInput.disabled = true;
                
                fetch('/user/get-phone', { method: 'GET' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('phoneInput').value = data.phone;
                    }
                });
            }
        }

        function sendCode() {
            const phone = document.getElementById('phoneInput').value;
            if (!phone) {
                alert('无法获取手机号');
                return;
            }
            
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '发送中...';
            
            fetch('/user/send-password-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'phone=' + encodeURIComponent(phone)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('验证码: ' + data.code);
                    let count = 60;
                    sendCodeBtn.textContent = count + '秒后重发';
                    const timer = setInterval(() => {
                        count--;
                        if (count <= 0) {
                            clearInterval(timer);
                            sendCodeBtn.textContent = '发送验证码';
                            sendCodeBtn.disabled = false;
                        } else {
                            sendCodeBtn.textContent = count + '秒后重发';
                        }
                    }, 1000);
                } else {
                    alert(data.message);
                    sendCodeBtn.textContent = '发送验证码';
                    sendCodeBtn.disabled = false;
                }
            })
            .catch(() => {
                alert('发送失败');
                sendCodeBtn.textContent = '发送验证码';
                sendCodeBtn.disabled = false;
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const verifyType = document.getElementById('verifyType').value;
            if (verifyType === 'sms') {
                switchVerify('sms');
            } else {
                switchVerify('password');
            }
        });
    </script>
</body>
</html>

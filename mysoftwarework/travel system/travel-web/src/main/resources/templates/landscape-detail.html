<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${landscape.title}">景点详情</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.15&key=ee7b7be648faf8d9200c001ecab389b0"></script>
    <style>
        .layout { display: flex; gap: 28px; margin-top: 16px; }
        .main { flex: 3; }
        .side { flex: 1; min-width: 260px; }
        .hero { width: 100%; height: 360px; border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
        .hero img { width: 100%; height: 100%; object-fit: cover; }
        .meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: #6c757d; margin: 12px 0; }
        .content { white-space: pre-wrap; line-height: 1.8; color: #333; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .comment { border-bottom: 1px solid #f0f0f0; padding: 14px 0; }
        .comment:last-child { border-bottom: none; }
        .related { display: flex; gap: 10px; padding: 8px 0; cursor: pointer; text-decoration: none; color: inherit; }
        .related:hover { background: #f8f9fa; }
        .comment-actions { display: flex; gap: 8px; margin-top: 8px; }
        .edit-form { margin-top: 10px; }
        .map-container { width: 100%; height: 300px; border-radius: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div th:replace="~{fragments :: navbar(${navKey})}"></div>
<div class="page-wrap">
    <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${pendingAudit}" class="alert alert-error">该景点尚未通过审核，仅您本人可见。</div>
    <div class="layout">
        <div class="main">
            <div class="card">
                <h1 style="margin:0 0 12px;font-size:24px" th:text="${landscape.title}">标题</h1>
                <div class="actions" th:if="${!pendingAudit}">
                    <form th:if="${loginUserId != null}" th:action="@{/interactions/landscape/{id}/collect(id=${landscape.landscapeId})}" method="post">
                        <button type="submit" class="btn btn-sm" th:classappend="${collected} ? 'btn-primary' : 'btn-outline'"
                                th:text="${collected} ? '已收藏' : '收藏'">收藏</button>
                    </form>
                    <form th:if="${loginUserId != null}" th:action="@{/interactions/landscape/{id}/like(id=${landscape.landscapeId})}" method="post">
                        <button type="submit" class="btn btn-sm" th:classappend="${liked} ? 'btn-primary' : 'btn-outline'"
                                th:text="${liked} ? '已点赞（' + ${likeCount} + '）' : '点赞（' + ${likeCount} + '）'">点赞</button>
                    </form>
                    <span th:if="${loginUserId == null}" class="muted">登录后可点赞、收藏</span>
                </div>
                <div class="hero">
                    <img th:if="${landscape.imagePath != null}" th:src="${landscape.imagePath}" th:alt="${landscape.title}"/>
                    <img th:unless="${landscape.imagePath != null}" th:src="@{'https://picsum.photos/seed/' + ${landscape.landscapeId} + '/1200/600'}" th:alt="${landscape.title}"/>
                </div>
                <div class="meta">
                    <span th:text="'地址：' + ${landscape.address}">地址</span>
                    <span th:text="'等级：' + ${landscape.level}">等级</span>
                    <span th:text="'开放：' + ${landscape.openingTime}">开放</span>
                    <span th:text="'电话：' + ${landscape.landscapeTel}">电话</span>
                    <span th:text="'发布：' + ${#temporals.format(landscape.publishTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                </div>
                <h3 style="color:#1a56db">景点位置</h3>
                <div id="map-container" class="map-container"></div>
                <h3 style="color:#1a56db">景点介绍</h3>
                <div class="content" th:text="${landscape.content}">内容</div>
            </div>
            <div class="card" th:if="${!pendingAudit}">
                <h3 style="margin-top:0">游客评论（<span th:text="${#lists.size(comments)}">0</span>）</h3>
                <form th:if="${loginUserId != null}" th:action="@{/comments/landscape}" method="post" style="margin-bottom:20px">
                    <input type="hidden" name="landscapeId" th:value="${landscape.landscapeId}"/>
                    <textarea class="layui-textarea" name="content" rows="4" placeholder="分享你的游玩体验" required></textarea>
                    <button type="submit" class="btn btn-primary" style="margin-top:10px">发表评论</button>
                </form>
                <p th:if="${loginUserId == null}" class="muted"><a th:href="@{/login(next=${'/landscapes/' + landscape.landscapeId})}">登录</a> 后发表评论</p>
                <div class="comment" th:each="c : ${comments}">
                    <div style="display:flex;justify-content:space-between;font-size:13px">
                        <strong th:text="${c.userName}">用户</strong>
                        <span class="muted" th:text="${#temporals.format(c.publishTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                    </div>
                    <p style="margin:8px 0 0" id="comment-content-[[${c.commentId}]]">[[${c.content}]]</p>
                    <div class="comment-actions" id="comment-actions-[[${c.commentId}]]">
                        <span th:if="${loginUserId != null and loginUserId == c.userId}">
                            <button type="button" class="btn btn-sm btn-outline" style="color:#1a56db;border-color:#1a56db" onclick="showEditForm('[[${c.commentId}]]')">编辑</button>
                            <form th:action="@{/comments/landscape/{cid}/delete(cid=${c.commentId})}" method="post" style="display:inline" onsubmit="return confirm('确定要删除这条评论吗？')">
                                <button type="submit" class="btn btn-sm btn-outline" style="color:#c0392b;border-color:#f5c6cb">删除</button>
                            </form>
                        </span>
                    </div>
                    <div id="edit-form-[[${c.commentId}]]" style="display:none;margin-top:10px;">
                        <form th:action="@{/comments/landscape/{cid}/update(cid=${c.commentId})}" method="post">
                            <textarea class="layui-textarea" name="content" rows="3" required>[[${c.content}]]</textarea>
                            <div style="display:flex;gap:8px;margin-top:8px">
                                <button type="submit" class="btn btn-sm btn-primary">保存</button>
                                <button type="button" class="btn btn-sm btn-outline" onclick="hideEditForm('[[${c.commentId}]]')">取消</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="side">
            <div class="card">
                <h3 style="margin-top:0">相关推荐</h3>
                <a class="related" th:each="r : ${related}" th:href="@{/landscapes/{id}(id=${r.landscapeId})}">
                    <img width="72" height="48" style="border-radius:4px;object-fit:cover"
                         th:if="${r.imagePath != null}" th:src="${r.imagePath}"/>
                    <img width="72" height="48" style="border-radius:4px;object-fit:cover"
                         th:unless="${r.imagePath != null}" th:src="@{'https://picsum.photos/seed/' + ${r.landscapeId} + '/160/100'}"/>
                    <div>
                        <div style="font-size:14px" th:text="${r.title}">名称</div>
                        <div class="muted" style="font-size:12px" th:text="${r.level}">等级</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script>
function showEditForm(commentId) {
    document.getElementById('comment-content-' + commentId).style.display = 'none';
    document.getElementById('comment-actions-' + commentId).style.display = 'none';
    document.getElementById('edit-form-' + commentId).style.display = 'block';
}

function hideEditForm(commentId) {
    document.getElementById('edit-form-' + commentId).style.display = 'none';
    document.getElementById('comment-content-' + commentId).style.display = 'block';
    document.getElementById('comment-actions-' + commentId).style.display = 'block';
}

function initMap() {
    var latitude = [[${landscape.latitude}]];
    var longitude = [[${landscape.longitude}]];
    var title = "[[${landscape.title}]]";
    var address = "[[${landscape.address}]]";
    
    if (latitude && longitude && !isNaN(latitude) && !isNaN(longitude)) {
        var map = new AMap.Map('map-container', {
            resizeEnable: true,
            zoom: 15,
            center: [longitude, latitude]
        });
        
        var marker = new AMap.Marker({
            position: [longitude, latitude],
            title: title,
            icon: new AMap.Icon({
                size: new AMap.Size(40, 50),
                image: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png',
                imageSize: new AMap.Size(40, 50)
            })
        });
        
        map.add(marker);
        
        var infoWindow = new AMap.InfoWindow({
            content: '<div style="padding:10px;">' +
                     '<h4 style="margin:0 0 8px;color:#1a56db;">' + title + '</h4>' +
                     '<p style="margin:0;font-size:14px;">地址：' + address + '</p>' +
                     '</div>',
            offset: new AMap.Pixel(0, -20)
        });
        
        marker.on('click', function() {
            infoWindow.open(map, marker.getPosition());
        });
        
        infoWindow.open(map, marker.getPosition());
    } else {
        document.getElementById('map-container').innerHTML = '<div style="padding:40px 12px;background:#f8f9fa;border-radius:6px;text-align:center;color:#6c757d;height:220px;display:flex;align-items:center;justify-content:center;">暂无地图坐标信息</div>';
    }
}

window.onload = initMap;
</script>
</body>
</html>

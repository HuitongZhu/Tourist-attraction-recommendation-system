<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>推荐帖</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar(${navKey})}"></div>
<div class="page-wrap">
    <h2 style="border-left:4px solid #1a56db;padding-left:10px">推荐帖</h2>
    
    <div class="search-bar" style="background:#fff;padding:20px;border-radius:8px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div style="flex:1;min-width:200px">
            <label>关键词</label>
            <input class="layui-input" id="keyword" th:value="${keyword}" placeholder="推荐帖标题、内容等"/>
        </div>
        <button type="button" class="btn btn-primary" onclick="searchPosts()">搜索</button>
        <button type="button" class="btn btn-outline" onclick="resetSearch()">重置</button>
    </div>
    
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:14px;color:#6c757d">
        <span>共 <strong th:text="${#lists.size(posts)}">0</strong> 条</span>
    </div>
    
    <div class="card" th:each="p : ${posts}" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px">
            <a th:href="@{/posts/{id}(id=${p.recomId})}" style="font-size:16px;font-weight:600;color:#333;text-decoration:none" th:text="${p.title != null ? p.title : '未命名帖子'}">标题</a>
            <span th:if="${landscapeTitles[p.recomId] != null}" style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:4px;font-size:12px">
                [[${landscapeTitles[p.recomId]}]]
            </span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;" th:if="${p.tag != null and p.tag != ''}">
            <th:block th:each="tagItem : ${p.tag.split(',')}">
                <span class="tag" style="background:#f5f5f5;color:#666;padding:2px 8px;border-radius:4px;font-size:12px" th:text="'#' + ${tagItem.trim()}"></span>
            </th:block>
        </div>
        <p class="muted" style="font-size:13px;margin:8px 0 0" th:text="${#strings.abbreviate(p.content, 120)}">摘要</p>
        <p class="muted" style="font-size:12px;margin-top:8px" th:text="${#temporals.format(p.publishTime, 'yyyy-MM-dd HH:mm')}">时间</p>
    </div>
    <p th:if="${#lists.isEmpty(posts)}" class="muted" style="padding:40px;text-align:center">暂无推荐帖</p>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script>
    function searchPosts() {
        const keyword = document.getElementById('keyword').value.trim();
        const url = new URL(window.location.href);
        if (keyword) {
            url.searchParams.set('keyword', keyword);
        } else {
            url.searchParams.delete('keyword');
        }
        window.location.href = url.toString();
    }
    
    function resetSearch() {
        document.getElementById('keyword').value = '';
        const url = new URL(window.location.href);
        url.searchParams.delete('keyword');
        window.location.href = url.toString();
    }
    
    // 按回车键搜索
    document.getElementById('keyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchPosts();
        }
    });
</script>
</body>
</html>
